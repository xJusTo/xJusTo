<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff">
        <animate attributeName="stop-color" values="#00d2ff;#3a7bd5;#00d2ff" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#3a7bd5">
        <animate attributeName="stop-color" values="#3a7bd5;#00d2ff;#3a7bd5" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <rect width="800" height="200" fill="transparent" />

  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="4s" repeatCount="indefinite" />
    
    <text x="400" y="90" font-family="Arial, sans-serif" font-size="55" font-weight="bold" fill="#ffffff" text-anchor="middle">
      Привет, я <tspan fill="#2CA5E0">{</tspan> xJusTo <tspan fill="#2CA5E0">}</tspan> 👋
    </text>
    
    <text x="400" y="140" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#textGrad)" text-anchor="middle">
      Backend Developer | C# &amp; ASP.NET Core
    </text>
  </g>
</svg>
