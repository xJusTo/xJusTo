<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <!-- Animated Gradient for Subtitle -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff">
        <animate attributeName="stop-color" values="#00d2ff;#3a7bd5;#00d2ff" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#3a7bd5">
        <animate attributeName="stop-color" values="#3a7bd5;#00d2ff;#3a7bd5" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Neon Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur" />
      <feFlood flood-color="#2CA5E0" flood-opacity="0.6" result="glowColor" />
      <feComposite in="glowColor" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font: 800 55px 'Segoe UI', Arial, sans-serif;
      fill: #ffffff;
      letter-spacing: 1px;
    }
    .subtitle {
      font: 600 24px 'Segoe UI', Arial, sans-serif;
      fill: url(#textGrad);
      letter-spacing: 0.5px;
    }
    .bracket {
      fill: #2CA5E0;
    }
    .float {
      animation: floating 4s ease-in-out infinite;
      transform-origin: center;
    }
    @keyframes floating {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
  </style>

  <!-- Transparent Background -->
  <rect width="800" height="200" fill="transparent" />

  <!-- Animated Content Group -->
  <g class="float" transform="translate(400, 100)">
    <text x="0" y="-10" text-anchor="middle" class="title" filter="url(#glow)">
      Привет, я <tspan class="bracket">{</tspan> xJusTo <tspan class="bracket">}</tspan> 👋
    </text>
    <text x="0" y="40" text-anchor="middle" class="subtitle">
      Backend Developer | C# &amp; ASP.NET Core
    </text>
  </g>
</svg>
